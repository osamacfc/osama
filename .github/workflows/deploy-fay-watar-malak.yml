name: Deploy Fay Watar Malak offline games
on:
  push:
    branches:
      - fay-watar-malak-offline
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fay-watar-malak
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
